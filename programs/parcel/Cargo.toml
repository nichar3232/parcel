[package]
name = "parcel"
version = "0.1.0"
edition = "2021"
# platform-tools v1.51.1 builds devnet's SBPFv3 and ships Rust 1.84; this keeps
# the lockfile resolvable by it.
rust-version = "1.84"
[lib]
crate-type = ["cdylib", "lib"]
name = "parcel"
[features]
default = ["custom-heap"]
no-entrypoint = []
cpi = ["no-entrypoint"]
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
# Declares the public devnet program id instead of the private validator's.
devnet = []
[dependencies]
anchor-lang = "=0.32.1"
anchor-spl = { version = "=0.32.1", default-features = false, features = ["token", "token_2022"] }
solana-sha256-hasher = "=2.3.0"
solana-program-entrypoint = "=2.3.0"
